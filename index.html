<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚拟细胞库 · 细胞工作台</title><link rel="stylesheet" href="style.css"></head><body><header><b>◉ AI4Science <span>虚拟细胞库</span></b><a href="https://github.com/ArcInstitute/arc-virtual-cell-atlas/tree/main/scBaseCount" target="_blank" rel="noopener">scBaseCount 来源 ↗</a></header><main><div class="title"><div><small>CELL EXPLORER</small><h1>细胞数据工作台</h1></div><span class="badge">真实数据 · 单样本浏览</span></div><div id="stats">正在读取细胞索引…</div><div class="toolbar"><label>细胞条码 / 类型<input id="search" placeholder="搜索细胞 ID 或细胞类型"></label><label>细胞类型<select id="type"><option value="">全部细胞类型</option></select></label><label>排序<select id="sort"><option value="id">条码</option><option value="umi">UMI 从高到低</option><option value="genes">基因数从高到低</option></select></label><button id="reset">重置</button><button id="export">导出筛选表 CSV ↓</button></div><div class="workspace"><section class="table-panel"><div class="table-title"><b>细胞列表</b><span id="count" aria-live="polite"></span></div><div class="scroll"><table><thead><tr><th>细胞 ID</th><th>细胞类型（来源注释）</th><th>UMI 总数</th><th>检出基因</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><button id="prev">← 上一页</button><span id="page"></span><button id="next">下一页 →</button></div></section><aside id="detail"><div class="empty">◎<h2>选择一个细胞</h2><p>点击左侧任一行，查看表达谱、细胞注释与数据来源。</p></div></aside></div><footer>当前接入 scBaseCount 2026-01-12 / ERX10300687 人类样本。表达值为 GeneFull_Ex50pAS 的 Unique UMI 计数，未做归一化。细胞类型沿用来源注释；本页不提供虚拟细胞模拟。</footer></main><script src="app.js"></script></body></html>
